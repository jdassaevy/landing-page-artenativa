name: CI

on:
  push:
    branches:
      - feat/arte-nativa-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm vitest run

      - name: Build
        run: pnpm build

  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify CLI commands
        run: |
          supabase --help >/dev/null
          supabase db start --help >/dev/null
          supabase test db --help >/dev/null
          supabase gen types --help >/dev/null

      - name: Start local database
        run: supabase db start

      - name: Database tests
        run: supabase test db

      - name: Verify generated database types are current
        run: |
          supabase gen types --lang typescript --local > /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts
