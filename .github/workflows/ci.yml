name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Motion RED/GREEN test
        run: pnpm vitest run src/components/motion/motion-provider.test.tsx

      - name: Test suite
        run: pnpm vitest run

      - name: Build
        run: pnpm build

      - name: Bootstrap lockfile on PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml already tracked"
            exit 0
          fi
          encoded="$(base64 -w0 pnpm-lock.yaml)"
          jq -n \
            --arg message "chore: lock resolved dependencies" \
            --arg content "$encoded" \
            --arg branch "$HEAD_BRANCH" \
            '{message: $message, content: $content, branch: $branch}' > /tmp/lockfile-payload.json
          curl --fail-with-body -L \
            -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml" \
            --data-binary @/tmp/lockfile-payload.json
