name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Refresh observability dependencies
        if: github.event_name == 'pull_request'
        run: pnpm add @vercel/analytics@latest @vercel/speed-insights@latest --save-exact --lockfile-only

      - name: Commit dependency graph once
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Observability dependencies already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json pnpm-lock.yaml
            git commit -m "chore: add vercel analytics and speed insights"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Motion reduced-motion test
        run: pnpm vitest run src/components/motion/motion-provider.test.tsx

      - name: Test suite
        run: pnpm vitest run

      - name: Build
        run: pnpm build
