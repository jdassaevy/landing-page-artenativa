name: Database tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Inspect CLI
        run: |
          supabase --version
          supabase test db --help

      - name: Start local database
        run: supabase db start

      - name: Run pgTAP database tests
        run: supabase test db
