name: Database tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Inspect CLI
        run: |
          supabase --version
          supabase test db --help
          supabase gen types --help

      - name: Start local database
        run: supabase db start

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Generate database types
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p src/types
          supabase gen types typescript --local > src/types/database.ts

      - name: Commit generated database types once
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- src/types/database.ts && git ls-files --error-unmatch src/types/database.ts >/dev/null 2>&1; then
            echo "Database types already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/database.ts
          git commit -m "chore: generate Supabase database types"
          git push origin "HEAD:${{ github.head_ref }}"
